name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM and EAS CLI
        run: |
          npm install -g pnpm
          npm install -g eas-cli

      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd void-rise-mobile
          pnpm install

      - name: Build Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd void-rise-mobile
          eas build --platform android --profile preview --local --output ./app-build.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-rise-app
          path: void-rise-mobile/app-build.apk
